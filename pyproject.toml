[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "RAG attack and information leakage diagnostic system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "bbana", email = "21011742@sejong.ac.kr"},
]

dependencies = [
  "haystack-ai>=2.9.0",
  "faiss-cpu>=1.9.0",
  "sentence-transformers>=3.0.0",
  "datasets>=2.20.0",
  "transformers>=4.50.0",
  "torch>=2.5.0",
  "peft>=0.13.0",
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.0",
  "tensorboard>=2.16.0",
  "openai>=1.10.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "rouge-score>=0.1.2",
  "pypdf>=4.0.0",
  "docling-haystack>=0.1.2",
  "reportlab>=4.1.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.1.0",
  "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
rag = "rag.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py311"
exclude = ["src/rag/report/dashboard_template.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
